name: Verify Project Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci currently fails because the committed lockfile does not match
      # package.json (nanoid 3.x versus 6.x). Use the same reconciliation step
      # as CI until package-lock.json is regenerated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify project files
        run: npx tsx scripts/verify-project-files.ts

      - name: Type check
        run: npm run check
