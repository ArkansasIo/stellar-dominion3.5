name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The checked-in lockfile is currently stale for nanoid. Use npm install
      # so CI can reconcile package.json and package-lock.json before checking
      # and building the application. Once the lockfile is regenerated and
      # committed, this can safely return to npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_dominion
          SESSION_SECRET: ci-only-session-secret
